# Checks links in the documentation with lychee
# (https://github.com/lycheeverse/lychee-action) and fails if a link is broken.
# The report appears in the run's summary page.
#
# Links to skip: .lycheeignore

name: Link check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docs/**/*.md"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: link-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './docs/**/*.md' './README.md'
          fail: true
